function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function markdown(md) {
  if (!md) return "";
  let h = escapeHtml(md);
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = h.split('\n');
  const out = [];
  let inList = false;
  for (const line of lines) {
    if (/^- (.+)$/.test(line)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(line.replace(/^- (.+)$/, '<li>$1</li>'));
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      if (line.trim() === "") out.push("");
      else if (/^<(h\d|ul|li|p)/.test(line)) out.push(line);
      else out.push('<p>' + line + '</p>');
    }
  }
  if (inList) out.push('</ul>');
  return out.join('\n');
}

function autoSlug(title) {

  const isNew = !currentEditId;
  const content = `
    <div class="max-w-3xl mx-auto px-4 py-10">
      <div class="flex items-center justify-between mb-8">
        <h1 class="text-2xl font-bold">${isNew ? "New Post" : "Edit Post"}</h1>
        <button onclick="cancelEdit()" class="text-sm text-muted hover:text-accent">Cancel</button>
      </div>

      <label class="block text-sm font-medium mb-2">Title *</label>
      <input id="e_title" type="text" value="${escapeAttr(post.title)}"
             class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 mb-4 focus:border-accent outline-none"
             placeholder="e.g. How Laser Hair Removal Works" oninput="autoFillSlug()">

      <label class="block text-sm font-medium mb-2">Slug (URL) *</label>
      <input id="e_slug" type="text" value="${escapeAttr(post.slug)}"
             class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 mb-1 focus:border-accent outline-none"
             placeholder="how-laser-hair-removal-works" oninput="this.dataset.touched=1">
      <p class="text-xs text-muted mb-4">Lowercase letters, numbers, and dashes only</p>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-2">Date *</label>
          <input id="e_date" type="date" value="${escapeAttr(post.date)}"
                 class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 focus:border-accent outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Category</label>
          <input id="e_category" type="text" value="${escapeAttr(post.category || "")}"
                 class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 focus:border-accent outline-none"
                 placeholder="e.g. Guides">
        </div>
      </div>

      <label class="block text-sm font-medium mb-2">Description</label>
      <textarea id="e_description" rows="2"
                class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 mb-1 focus:border-accent outline-none"
                placeholder="Short summary shown on listings">${escapeHtml(post.description || "")}</textarea>
      <p class="text-xs text-muted mb-4">Aim for 120–160 characters</p>

      <label class="block text-sm font-medium mb-2">Body *</label>
      <textarea id="e_body" rows="20"
                class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 mb-1 font-mono text-sm focus:border-accent outline-none"
                placeholder="# Heading&#10;&#10;Your paragraph here.&#10;&#10;- Bullet 1&#10;- Bullet 2&#10;&#10;**Bold** and *italic*">${escapeHtml(post.body || "")}</textarea>
      <p class="text-xs text-muted mb-6">Markdown supported: # H1, ## H2, **bold**, *italic*, - list, [link](url)</p>

      <button onclick="savePost()" class="w-full bg-accent text-bg font-semibold py-3.5 rounded-lg hover:opacity-90 transition">
        ${isNew ? "Create Post" : "Save Changes"}
      </button>
      <p class="text-xs text-muted text-center mt-3">Changes are stored locally. Click "Download Updated Site" on the dashboard to publish.</p>
    </div>
  `;
  document.getElementById("app").innerHTML = layout(content);
}

function autoFillSlug() {
  const title = document.getElementById("e_title").value;
  const slug = document.getElementById("e_slug");
  if (!slug.dataset.touched) slug.value = autoSlug(title);
}

function cancelEdit() { location.hash = "#/admin"; }

function savePost() {
  const title = document.getElementById("e_title").value.trim();
  const slug = document.getElementById("e_slug").value.trim();
  const date = document.getElementById("e_date").value;
  const category = document.getElementById("e_category").value.trim();
  const description = document.getElementById("e_description").value.trim();
  const body = document.getElementById("e_body").value.trim();

  if (!title) { alert("Title is required"); return; }
  if (!slug) { alert("Slug is required"); return; }
  if (!/^[a-z0-9-]+$/.test(slug)) { alert("Slug must contain only lowercase letters, numbers, and dashes"); return; }
  if (!date) { alert("Date is required"); return; }
  if (!body) { alert("Body is required"); return; }

  const conflict = posts.find(p => p.slug === slug && p.id !== currentEditId);
  if (conflict) { alert("Another post already uses this slug"); return; }

  if (currentEditId) {
    const idx = posts.findIndex(p => p.id === currentEditId);
    posts[idx] = { id: currentEditId, title, slug, date, category, description, body };
  } else {
    posts.unshift({ id: "p_" + Date.now(), title, slug, date, category, description, body });
  }
  savePosts();
  location.hash = "#/admin";
}

function deletePost(id) {
  if (!confirm("Delete this post? This cannot be undone.")) return;
  posts = posts.filter(p => p.id !== id);
  savePosts();
  renderAdmin();
}

function discardEdits() {
  if (!confirm("Discard all local changes and revert to the last published version?")) return;
  clearLocalPosts();
  posts = loadPosts();
  renderAdmin();
}

function downloadSite() {
  const clone = document.documentElement.cloneNode(true);
  const app = clone.querySelector("#app");
  if (app) app.innerHTML = "";
  const dataScript = clone.querySelector("#posts-data");
  if (dataScript) dataScript.textContent = JSON.stringify({ posts }, null, 2);

  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  setTimeout(() => {
    alert("✅ index.html downloaded!\n\nNext: go to app.netlify.com/drop and drop this file. Your site updates in ~10 seconds.");
  }, 300);
}

/* ============================================================
   ROUTER
   ============================================================ */
function route() {
  const hash = location.hash.replace(/^#/, "") || "/";
  if (hash === "/admin") { renderAdmin(); }
  else if (hash.startsWith("/post/")) { renderPost(decodeURIComponent(hash.slice(6))); }
  else if (hash === "/blog") { renderBlogList(); }
  else { renderHome(); }
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
   ============================================================ */
captureTemplate();
posts = loadPosts();
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
route();
</script>
</body>
</html>
